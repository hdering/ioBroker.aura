version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # React 19 migration is a deliberate, coupled effort (react + react-dom +
      # types + the bundled lib chain). Block all React major bumps; 18.x
      # minor/patch updates still flow through.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # react-leaflet v5 requires React 19 (peer: react/react-dom ^19); we are
      # on React 18 and vitepress' @docsearch/react caps react at <19. Comes
      # with the React 19 migration, not before.
      - dependency-name: "react-leaflet"
        update-types: ["version-update:semver-major"]
      # Vite major bumps (5→6→7→8) are breaking and need a deliberate
      # migration; block them. Minor/patch updates still flow through.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react v5 is ESM-only and breaks our CommonJS-loaded
      # vite.config.ts (the package is not type:module because main.js is CJS).
      # Adopting it needs an ESM config migration; block the major for now.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # zustand v5 sends the production build into a React error #185 render
      # loop on every route (dev build is fine, so CI does not catch it); we
      # pinned back to v4 in #368. A retry needs a live profiler session on the
      # loop, not a dependency bump.
      - dependency-name: "zustand"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
