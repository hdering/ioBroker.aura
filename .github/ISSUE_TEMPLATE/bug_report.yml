name: Bug report
description: Report a problem with the Aura dashboard
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Drag & drop screenshots here — they help a lot.
    validations:
      required: true

  - type: textarea
    id: widget-export
    attributes:
      label: Widget export
      description: >
        If the problem is about a specific widget, export it
        (widget menu → Export) and paste the JSON here.
      render: json
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Browser console / ioBroker log
      description: >
        Browser console (F12 → Console) while the problem happens, and/or the
        ioBroker log of the aura adapter. Errors and warnings are enough.
      render: shell
    validations:
      required: false

  - type: input
    id: aura-version
    attributes:
      label: Aura version
      placeholder: e.g. 0.11.1
    validations:
      required: true

  - type: checkboxes
    id: export-confirm
    attributes:
      label: Checklist
      options:
        - label: I pasted the widget export above, or the problem is not about a specific widget.
          required: true
