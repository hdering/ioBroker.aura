<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Ground floor example for the Aura floor-plan guide. One grid cell of the
       20x20 custom grid = 40 x 50 units, so x/40 = column and y/50 = row. -->
  <defs>
    <pattern id="tiles" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#f1f5f9"/>
      <path d="M40 0H0V40" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="#ffffff"/>

  <!-- floors -->
  <rect x="36" y="36" width="728" height="395" fill="#f8fafc"/>
  <rect x="36" y="431" width="728" height="533" fill="url(#tiles)"/>

  <!-- furniture: Wohnen / Essen -->
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="3">
    <rect x="200" y="175" width="170" height="100" rx="6"/>
    <rect x="212" y="140" width="40" height="28" rx="8"/>
    <rect x="265" y="140" width="40" height="28" rx="8"/>
    <rect x="318" y="140" width="40" height="28" rx="8"/>
    <rect x="212" y="282" width="40" height="28" rx="8"/>
    <rect x="265" y="282" width="40" height="28" rx="8"/>
    <rect x="318" y="282" width="40" height="28" rx="8"/>
    <rect x="690" y="120" width="60" height="230" rx="10"/>
    <rect x="618" y="175" width="50" height="120" rx="6"/>
    <rect x="470" y="400" width="250" height="24" rx="3"/>
  </g>

  <!-- furniture: Küche -->
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="3">
    <rect x="36" y="440" width="54" height="250"/>
    <rect x="90" y="642" width="290" height="48"/>
    <rect x="46" y="470" width="34" height="50" rx="4"/>
    <rect x="150" y="650" width="60" height="32" rx="3"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2.5">
    <circle cx="166" cy="666" r="7"/>
    <circle cx="194" cy="666" r="7"/>
  </g>

  <!-- furniture: HWR / Technik -->
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="3">
    <rect x="48" y="905" width="58" height="52" rx="6"/>
    <rect x="114" y="905" width="58" height="52" rx="6"/>
    <rect x="290" y="716" width="80" height="90" rx="4"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2.5">
    <circle cx="77" cy="931" r="16"/>
    <circle cx="143" cy="931" r="16"/>
  </g>

  <!-- stairs -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none">
    <rect x="560" y="445" width="196" height="200" fill="#ffffff"/>
    <path d="M560 470H756M560 495H756M560 520H756M560 545H756M560 570H756M560 595H756M560 620H756"/>
    <path d="M600 630V470L590 486M600 470L610 486" stroke="#64748b" stroke-width="3"/>
  </g>

  <!-- furniture: WC -->
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="3">
    <rect x="712" y="676" width="40" height="50" rx="18"/>
    <rect x="572" y="676" width="40" height="34" rx="10"/>
  </g>

  <!-- walls -->
  <g fill="#334155">
    <!-- outer walls -->
    <path fill-rule="evenodd" d="M10 10H790V990H10Z M36 36V964H764V36Z"/>
    <!-- kitchen / living: half-height counter line, wall on the stairs side -->
    <rect x="556" y="425" width="208" height="12"/>
    <!-- kitchen | Diele stub -->
    <rect x="380" y="437" width="12" height="80"/>
    <!-- kitchen / HWR -->
    <rect x="36" y="695" width="356" height="12"/>
    <!-- HWR | Diele (door gap 800..890) -->
    <rect x="380" y="695" width="12" height="105"/>
    <rect x="380" y="890" width="12" height="74"/>
    <!-- stairs / WC -->
    <rect x="545" y="655" width="219" height="12"/>
    <!-- WC | Diele (door gap 735..815) -->
    <rect x="545" y="655" width="12" height="80"/>
    <rect x="545" y="815" width="12" height="149"/>
    <!-- WC / Abstellraum (door gap 600..660) -->
    <rect x="557" y="823" width="43" height="12"/>
    <rect x="660" y="823" width="104" height="12"/>
  </g>
  <path d="M36 431H556" stroke="#94a3b8" stroke-width="3" stroke-dasharray="14 8"/>

  <!-- windows and doors in the outer walls -->
  <g fill="#bae6fd" stroke="#334155" stroke-width="2">
    <rect x="150" y="10" width="110" height="26"/>
    <rect x="500" y="10" width="110" height="26"/>
    <rect x="10" y="180" width="26" height="140"/>
    <rect x="10" y="500" width="26" height="110"/>
    <rect x="10" y="770" width="26" height="90"/>
    <rect x="764" y="150" width="26" height="160"/>
    <rect x="764" y="740" width="26" height="60"/>
    <rect x="120" y="964" width="120" height="26"/>
  </g>
  <!-- terrace doors and front door: swing arcs -->
  <g fill="none" stroke="#64748b" stroke-width="2.5">
    <path d="M150 36V146A110 110 0 0 0 260 36"/>
    <path d="M610 36V146A110 110 0 0 1 500 36"/>
    <path d="M400 964V884A80 80 0 0 1 480 964"/>
    <path d="M392 800H472A90 90 0 0 1 392 890"/>
    <path d="M557 735H617A80 80 0 0 1 557 815"/>
  </g>
  <rect x="400" y="964" width="80" height="26" fill="#ffffff" stroke="#334155" stroke-width="2"/>

  <!-- room labels -->
  <g fill="#475569">
    <text x="70" y="378" font-size="24" font-weight="600">Wohnen / Essen</text>
    <text x="70" y="404" font-size="17">29,4 m²</text>
    <text x="110" y="482" font-size="22" font-weight="600">Küche</text>
    <text x="110" y="505" font-size="16">10,1 m²</text>
    <text x="410" y="720" font-size="22" font-weight="600">Diele</text>
    <text x="410" y="743" font-size="16">16,1 m²</text>
    <text x="630" y="785" font-size="22" font-weight="600">WC</text>
    <text x="630" y="808" font-size="16">3,4 m²</text>
    <text x="70" y="800" font-size="22" font-weight="600">HWR / Technik</text>
    <text x="70" y="823" font-size="16">8,7 m²</text>
    <text x="300" y="830" font-size="14" fill="#64748b">Heizung</text>
    <text x="600" y="905" font-size="17" fill="#64748b">Abstellraum</text>
  </g>
</svg>
